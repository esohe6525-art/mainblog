<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniSocial - Connect and Share</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="/" class="brand-logo">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="m4.93 4.93 4.24 4.24"></path>
          <path d="m14.83 9.17 4.24-4.24"></path>
          <path d="m14.83 14.83 4.24 4.24"></path>
          <path d="m9.17 14.83-4.24 4.24"></path>
          <circle cx="12" cy="12" r="4"></circle>
        </svg>
        <span class="brand-text">Mini<span>Social</span></span>
      </a>

      <form action="/" method="get" class="nav-search-form" id="nav-search">
        <div class="search-input-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" name="q" placeholder="Search posts or people..." class="search-input">
        </div>
      </form>

      <nav class="nav-actions" id="nav-actions"></nav>
    </div>
  </header>

  <div class="messages-container" id="messages"></div>

  <main class="main-layout" id="app">
    <p style="text-align: center; color: var(--text-muted); padding: 3rem 0;">Loading…</p>
  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <p>&copy; 2026 MiniSocial &bull; Built on Netlify</p>
      <div class="footer-links" id="footer-links"></div>
    </div>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
